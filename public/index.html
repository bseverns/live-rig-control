<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Rig Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Live Rig Control</h1>
    <div id="profile-bar"></div>
    <div id="connection-bar">
      <select id="midi-output-select"></select>
      <button id="refresh-midi">Refresh MIDI</button>
      <label>
        <input type="checkbox" id="osc-enabled" />
        OSC bridge
      </label>
    </div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <script type="module" src="../src/app.js"></script>
</body>
</html>
