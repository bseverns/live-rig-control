name: iOS SwiftPM Build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-swiftpm.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-swiftpm.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build iOS (simulator)
        working-directory: ios
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swift build -c release --sdk "$SDK_PATH" --triple arm64-apple-ios17.0-simulator
